<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="h1">Calculator</h1>
    <div class="outerbox">
        <div class="answerbox">
            <p id="answerbx"></p>
        </div>

        <div class="input">
            <input id="input1">
        </div>

        <div class="input">
            <input id="input2">
        </div>

        <button class="button" id="addButton" onclick="addNumbers()">ADD</button>
        <button class="button" id="minusButton" onclick="minusNumbers()">SUBTRACT</button>
        <button class="button" id="multiplyButton" onclick="multiplyNumbers()">MULTIPLY</button>
        <button class="button" id="divideButton" onclick="divideNumbers()">DIVIDE</button>



    </div>
    <script src="index.js"></script>
</body>
</html>
